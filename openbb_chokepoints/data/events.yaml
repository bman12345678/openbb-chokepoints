# Chokepoint event catalog, v1 (hand-curated).  Owner: Anjaneya.
#
# Conventions
#   news_date   day 0 for Manan's event study: the first day the market could
#               have known (first credible public report).  Never the physical
#               onset if that came earlier/later.
#   start_date  physical onset, when different (optional).
#   type        disruption | recovery   (kept separate; recoveries are not
#               scored as detection targets).
#   sources     >= 2 independent sources, >= 1 "primary" (official notice,
#               company advisory, agency wire / first-hand report); the rest
#               "secondary" (trade press, analysis).
#   confidence  high | medium | low (dating certainty + independence).
#   overlaps_with  ids of events whose effects overlap in time/place, so the
#               event study does not double count.
#   notes       evidence for the date, paraphrased.
#
# Dates were checked against the sources listed, but re-verify anything
# marked `verify: true` before it is used in a published result.

events:
  - id: suez_ever_given_2021
    type: disruption
    name: Ever Given grounds in the Suez Canal
    category: blockage
    chokepoint: suez_canal
    related_chokepoints: [bab_el_mandeb_strait, gibraltar_strait]
    news_date: 2021-03-23
    start_date: 2021-03-23
    end_date: 2021-03-29
    confidence: high
    sources:
      - {name: Lloyd's List, type: secondary, url: "https://lloydslist.maritimeintelligence.informa.com/LL1136229/Suez-Canal-remains-blocked-despite-efforts-to-refloat-grounded-Ever-Given"}
      - {name: Baird Maritime, type: secondary, url: "https://www.bairdmaritime.com/shipping/boxships/suez-canal-traffic-blocked-by-grounded-containership"}
      - {name: gCaptain, type: secondary, url: "https://gcaptain.com/grounded-mega-ship-blocking-suez-canal-in-both-directions"}
      - {name: WJLA / AP, type: primary, url: "https://wjla.com/news/nation-world/massive-cargo-ship-becomes-wedged-blocks-egypts-suez-canal-03-24-2021"}
    overlaps_with: []
    notes: >
      Container ship wedged across the canal on the morning of 23 March 2021;
      first wire reports that day. Canal blocked in both directions until refloat.

