[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openbb-chokepoints"
version = "0.1.0"
description = "Chokepoint disruption risk analytics for the OpenBB Platform."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Chokepoint Risk team" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "openbb-core>=2.0,<3",
    "openbb-equity>=2.0,<3",
    "openbb-yfinance>=2.0,<3",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "statsmodels>=0.14",
]

[project.entry-points."openbb_core_extension"]
chokepoints = "openbb_chokepoints.router:router"

[tool.setuptools.packages.find]
include = ["openbb_chokepoints*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: needs network access and a built OpenBB package; run with -m integration",
]
